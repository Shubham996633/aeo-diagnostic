name: Keep backend warm

# Render's free tier spins down a service after 15 minutes of inactivity.
# This workflow pings the /health endpoint every 5 minutes (GH Actions floor)
# to keep it warm. Schedules can still drift on free runners, so it's wise to
# pair this with an external uptime monitor (e.g. UptimeRobot) for redundancy.
# Scheduled workflows auto-disable after 60 days of repo inactivity.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repo variable not set — skipping."
            exit 0
          fi
          echo "Pinging $BACKEND_URL/health"
          curl -fsS --max-time 60 "$BACKEND_URL/health" || echo "ping failed (service may be cold-starting)"
