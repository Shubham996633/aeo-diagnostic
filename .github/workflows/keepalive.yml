name: Keep backend warm

# Render's free tier spins down a service after 15 minutes of inactivity.
# This workflow pings the /health endpoint every 10 minutes to keep it warm.
# Note: GitHub Actions schedules can drift up to ~10 minutes on free runners,
# and scheduled workflows are auto-disabled on repos with no activity for 60 days.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repo variable not set — skipping."
            exit 0
          fi
          echo "Pinging $BACKEND_URL/health"
          curl -fsS --max-time 60 "$BACKEND_URL/health" || echo "ping failed (service may be cold-starting)"
